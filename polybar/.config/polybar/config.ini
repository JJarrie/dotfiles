[global/wm]
margin-top = 0
margin-bottom = 0

[colors]
background = #1e1e2e
background-alt = #373B41
foreground = #c5c8c6
primary = #f9e2af
secondary = #8abeb7
alert = #a54242
disabled = #707880

rosewater = #f5e0dc
flamingo = #f2cdcd
pink = #f5c2e7
mauve = #cba6f7
red = #f38ba8
maroon = #eba0ac
peach = #fab387
yellow = #f9e2af
green = #a6e3a1
teal = #94e2d5
sky = #89dceb
sapphire = #74c7ec
blue = #89b4fa
lavender = #b4befe

text = #cdd6f4
subtext1 = #bac2de
subtext0 = #a6adc8
overlay2 = #9399b2
overlay1 = #7f849c
overlay0 = #6c7086
surface2 = #585b70
surface1 = #45475a
surface0 = #313244
base = #1e1e2e
mantle = #181825
crust = #11111b
transparent = #aaff00000

[bar/main-i3]
width = 100%
height = 24pt
radius = 0
bottom = true
monitor = ${env:MONITOR:DisplayPort-1}
wm-restack = i3

background = ${colors.base}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 0pt
border-color = #00000000

padding-left = 0
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = JetBrainsMono NF:size=15;4

modules-left = i3 
modules-right = pulseaudio cpu memory eth vpn date systray

cursor-click = pointer

enable-ipc = true
scroll-up = i3wm-wsnext
scroll-down = i3wm-wsprev

override-redirect = false

[module/systray]
type = internal/tray
tray-padding = 1

tray-position = center
tray-detached = true
format-margin = 0pt
tray-spacing = 10pt

[module/xworkspaces]
type = internal/xworkspaces
label-active = %name%
label-active-background = ${colors.mauve}
label-active-underline = ${colors.lauve}
label-active-foreground = ${colors.crust}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-foreground = ${colors.red}
label-urgent-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /
mount-1 = /home/

label-mounted = %{F#F0C674}%mountpoint%%{F-} %percentage_used%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.green}
format-volume = <label-volume>

label-volume = %percentage%

label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.sky}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.base}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.peach}
label = %percentage_used%%

[module/cpu]
type = internal/cpu
inteval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#74c7ec}%ifname%%{F#707880}

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#74c7ec}%ifname%%{F-} %essid% %local_ip%

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#74c7ec}%ifname%%{F-} %local_ip%

[module/ethernet]
type = internal/network
interface = enp5s0
interval = 3.0

format-connected = <label-connected> <ramp-signal>
format-connected-foreground = ${colors.foreground}
format-connected-background = ${colors.background}
format-disconnected = <label-disconnected>
format-disconnected-foreground = ${colors.foreground-alt}
format-disconnected-background = ${colors.background}

label-connected = %{F#00ff00}%{F-} Connected
label-disconnected = %{F#ff0000}%{F-} Disconnected

ramp-signal-0 = 
ramp-signal-1 = 
ramp-signal-2 = 
ramp-signal-3 = 
ramp-signal-4 = 
ramp-signal-5 = 

[module/date]
type = internal/date
interval = 1

date = %H:%M:%S
date-alt = %d/%m/%Y

label = %date%
label-foreground = ${colors.peach}

[module/i3]
type = internal/i3

pin-workspace = true
show-urgent = true
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = false
wrapping-scroll = false
reverse-scroll = false
fuzzy-match = true

format = <label-state> <label-mode>

label-mode = %mode%
label-mode-padding = 2
label-mode-foreground = ${colors.blue}
label-mode-background = ${colors.surface0}

label-focused = %index%
label-focused-foreground = ${colors.crust}
label-focused-background = ${colors.mauve}
label-focused-underline = ${colors.mauve}
label-focused-padding = 1

label-unfocused = %index%
label-unfocused-padding = 1

label-visible = %index%
label-visible-underline = #555555
label-visible-padding = 1

label-urgent = %index%
label-urgent-foreground = #000000
label-urgent-background = #bd2c40
label-urgent-padding = 1

[module/vpn]
type = custom/script
interval = 3
exec = ~/.config/polybar/scripts/vpn-nmcli-polybar.sh
click-left = ~/.config/polybar/scripts/vpn-nmcli-polybar.sh --toggle-connection &
format-prefix = "VPN "

[settings]
screenchange-reload = true
pseudo-transparency = true
