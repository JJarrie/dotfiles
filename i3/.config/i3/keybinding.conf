# rofi
bindsym $alt+space exec rofi -show drun --replace -i
bindsym $alt+Tab exec rofi -show window --replace -config ~/.config/rofi/window.rasi -i
bindsym $alt+r exec rofi -show run --replace -config ~/.config/rofi/run.rasi -i
bindsym $alt+p exec rofi -show power-menu -modi power-menu:~/.config/rofi/rofi-power-menu -i

# which poweroff
bindsym $mod+Shift+u exec systemctl poweroff

# i3 reload restart quit
bindsym $mod+Shift+c reload
bindsym $mod+Shift+r restart
bindsym $mod+Shift+e exec "i3-nagbar -t warning -m 'You pressed the exit shortcut. Do you really want to exit i3? This will end your X session.' -B 'Yes, exit i3' 'i3-msg exit'"

# kill focus window
bindsym $mod+q kill

# browser
bindsym $mod+b exec firefox

# terminal
# bindsym $mod+Return exec wezterm
bindsym $mod+Return exec ghostty

# file explorer
bindsym $mod+e exec thunar

# focus window
bindsym $mod+h focus left
bindsym $mod+j focus down
bindsym $mod+k focus up
bindsym $mod+l focus right

# move window
bindsym $mod+Shift+h move left
bindsym $mod+Shift+j move down
bindsym $mod+Shift+k move up
bindsym $mod+Shift+l move right

# toggle split dimension
bindsym $mod+a split h
bindsym $mod+d split v

# window action
bindsym $mod+f fullscreen toggle
bindsym $mod+p layout stacking
bindsym $mod+w layout tabbed
bindsym $mod+z layout toggle split
bindsym $mod+t floating toggle
bindsym $mod+n focus mode_toggle

# workspace action
bindsym $mod+ampersand workspace number 1
bindsym $mod+eacute workspace number 2
bindsym $mod+quotedbl workspace number 3
bindsym $mod+apostrophe workspace number 4
bindsym $mod+parenleft workspace number 5
bindsym $mod+minus workspace number 6
bindsym $mod+egrave workspace number 7
bindsym $mod+underscore workspace number 8
bindsym $mod+ccedilla workspace number 9
bindsym $mod+agrave workspace number 10
bindsym $alt+1 move container to workspace 1;workspace 1;focus
bindsym $alt+2 move container to workspace 2;workspace 2;focus
bindsym $alt+3 move container to workspace 3;workspace 3;focus
bindsym $alt+4 move container to workspace 4;workspace 4;focus
bindsym $alt+5 move container to workspace 5;workspace 5;focus
bindsym $alt+6 move container to workspace 6;workspace 6;focus
bindsym $alt+7 move container to workspace 7;workspace 7;focus
bindsym $alt+8 move container to workspace 8;workspace 8;focus
bindsym $alt+9 move container to workspace 9;workspace 9;focus
bindsym $alt+0 move container to workspace 10;workspace 10;focus

# Screenshots
bindsym Print exec --no-startup-id maim "/home/$USER/Images/Screenshots/$(date).png"
bindsym $mod+Print exec --no-startup-id maim --window "/home/$USER/Images/Screenshots/$(date).png"
bindsym Shift+Print exec --no-startup-id maim --select "/home/$USER/Images/Screenshots/$(date).png"

# Clipboard Screenshots
bindsym Ctrl+Print exec --no-startup-id maim | xclip -selection clipboard -t image/png
bindsym Ctrl+$mod+Print exec --no-startup-id maim --window $(xdotool getactivewindow) | xclip -selection clipboard -t image/png
bindsym Ctrl+Shift+Print exec --no-startup-id maim --select | xclip -selection clipboard -t image/png
